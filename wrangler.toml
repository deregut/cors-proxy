# Cloudflare Workers configuration
# Docs: https://developers.cloudflare.com/workers/wrangler/
#
# The entry point is the existing `src/worker.js` — a thin adapter over the
# shared `lib/proxy.js` (same SSRF guard, CORS, and 10 MB cap as the standalone
# server and Netlify function). The `ASSETS` binding serves the shared web UI
# from `./public`, so a single Workers deploy gets you both the API and the UI.

name = "cors-proxy"
main = "src/worker.js"
compatibility_date = "2024-09-23"

# Node.js compatibility so the shared lib/proxy.js (which uses Buffer) runs
# unchanged in the Worker runtime.
node_compat = true

# Serve the SHARED web UI (public/index.html) from the edge as static assets.
# Using a binding makes the Worker the entry point for every request; the
# Worker handles /api/proxy and delegates all other routes to env.ASSETS.
# This keeps ONE source of truth for the UI across Netlify / Docker / Cloudflare.
[assets]
  directory = "./public"
  binding = "ASSETS"

# No KV / Durable Objects / secrets are required — this is a stateless proxy.
# Free tier: 100,000 requests/day.
