services:
  cors-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: cors-proxy:latest
    container_name: cors-proxy
    ports:
      # Map to the container port (3000). Override the host port with HOST_PORT,
      # e.g. `HOST_PORT=8080 docker compose up`.
      - "${HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    restart: unless-stopped
    healthcheck:
      # alpine ships with busybox wget; the UI returns 200 at /.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
